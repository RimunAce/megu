[package]
name = "megu"
version = "0.1.0"
description = "A fast Windows anime app for AniList: discovery, list sync and playback."
authors = ["MEGU contributors"]
license = "MIT"
repository = "https://github.com/RimunAce/megu"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "megu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rusqlite = { version = "0.36", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["net", "macros", "rt-multi-thread", "io-util", "time", "sync"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
rand = "0.8"
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
