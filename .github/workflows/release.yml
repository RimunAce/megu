name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check updater signing configuration
        shell: pwsh
        env:
          MEGU_UPDATER_PUBLIC_KEY: ${{ vars.MEGU_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -ne "refs/tags/v$version") {
            throw "Release tag must match the application version v$version."
          }
          if (-not $env:MEGU_UPDATER_PUBLIC_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Configure MEGU_UPDATER_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY before publishing a release."
          }
          $configuredKey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if ($configuredKey.Trim() -ne $env:MEGU_UPDATER_PUBLIC_KEY.Trim()) {
            throw "MEGU_UPDATER_PUBLIC_KEY does not match the public key pinned in tauri.conf.json."
          }

      - name: Build installers and draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGU_UPDATER_PUBLIC_KEY: ${{ vars.MEGU_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_name }}
          releaseName: "MEGU ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/RimunAce/megu/blob/main/CHANGELOG.md) for what is new.

            **Windows 10/11 x64.** Download the `-setup.exe` (NSIS) installer unless you prefer MSI.
            NSIS installations of MEGU 0.1.1 and newer can check for updates in Settings.
            Earlier versions and MSI installations update by downloading an installer.
            `SHA256SUMS.txt` is attached to this release; verify the download before running it.
            Builds are unsigned, so SmartScreen may warn. Choose **More info → Run anyway** only
            when the checksum matches.
          releaseDraft: true
          prerelease: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megu-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish checksums with the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $lines = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe, *.msi |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          gh release upload $env:GITHUB_REF_NAME SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
